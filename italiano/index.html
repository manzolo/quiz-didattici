<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz di Italiano</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            margin-bottom: 30px;
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-5px);
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header h1 {
            color: white;
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.3em;
        }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .quiz-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            animation-fill-mode: both;
        }

        .quiz-card:nth-child(1) { animation-delay: 0.1s; }
        .quiz-card:nth-child(2) { animation-delay: 0.2s; }
        .quiz-card:nth-child(3) { animation-delay: 0.3s; }
        .quiz-card:nth-child(4) { animation-delay: 0.4s; }

        .quiz-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .quiz-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .quiz-title {
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .quiz-description {
            color: #666;
            font-size: 1.1em;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .quiz-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .coming-soon {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
        }

        .coming-soon-badge {
            background: #ccc;
            color: #666;
        }

        .level-tag {
            background: #f0f0f0;
            color: #888;
            font-size: 0.85em;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .language-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
        }

        .lang-btn {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .lang-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .lang-btn.active {
            background: white;
            color: #667eea;
        }

        .buy-me-coffee {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .buy-me-coffee:hover { transform: translateY(-5px); }

        .buy-me-coffee img {
            height: 50px;
            width: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.5em; }
            .quiz-card { padding: 30px; }
            .quiz-title { font-size: 1.5em; }
            .language-selector {
                position: relative;
                top: 0; right: 0;
                justify-content: center;
                margin-bottom: 20px;
            }
            .buy-me-coffee { bottom: 10px; right: 10px; }
            .buy-me-coffee img { height: 40px; }
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <button class="lang-btn active" onclick="setLanguage('it', event)">🇮🇹 IT</button>
        <button class="lang-btn" onclick="setLanguage('en', event)">🇬🇧 EN</button>
    </div>
    <div class="container">
        <a href="../index.html" class="back-button">
            <span data-i18n="back">← Torna all'indice</span>
        </a>

        <div class="header">
            <h1 data-i18n="title">📖 Quiz di Italiano</h1>
            <p data-i18n="subtitle">Grammatica italiana per la Scuola Media</p>
        </div>

        <div class="quiz-grid">
            <a href="tempi-verbi.html" class="quiz-card">
                <div class="quiz-icon">✍️</div>
                <div class="quiz-title" data-i18n="verb-tenses">Tempi dei Verbi</div>
                <div class="quiz-description" data-i18n="verb-tenses-desc">
                    Coniuga i verbi regolari e irregolari in tutti i tempi.
                    Indicativo, Congiuntivo, Condizionale e Imperativo!
                </div>
                <div class="level-tag" data-i18n="level-all">1ª, 2ª e 3ª Media</div>
                <div class="quiz-badge" data-i18n="available">Disponibile</div>
            </a>
        </div>
    </div>

    <a href="https://www.buymeacoffee.com/manzolo" target="_blank" class="buy-me-coffee">
        <img src="https://cdn.buymeacoffee.com/buttons/v2/default-blue.png" alt="Buy Me A Coffee">
    </a>

    <script>
        const translations = {
            it: {
                'back': '← Torna all\'indice',
                'title': '📖 Quiz di Italiano',
                'subtitle': 'Grammatica italiana per la Scuola Media',
                'verb-tenses': 'Tempi dei Verbi',
                'verb-tenses-desc': 'Coniuga i verbi regolari e irregolari in tutti i tempi. Indicativo, Congiuntivo, Condizionale e Imperativo!',
                'level-all': '1ª, 2ª e 3ª Media',
                'available': 'Disponibile',
                'coming-soon': 'Prossimamente'
            },
            en: {
                'back': '← Back to index',
                'title': '📖 Italian Quizzes',
                'subtitle': 'Italian grammar for Middle School',
                'verb-tenses': 'Verb Tenses',
                'verb-tenses-desc': 'Conjugate regular and irregular verbs in all tenses. Indicative, Subjunctive, Conditional and Imperative!',
                'level-all': '6th, 7th & 8th grade',
                'available': 'Available',
                'coming-soon': 'Coming Soon'
            }
        };

        let currentLanguage = 'it';

        function setLanguage(lang, evt) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if (evt && evt.target) {
                evt.target.classList.add('active');
            } else {
                const idx = lang === 'en' ? 1 : 0;
                document.querySelectorAll('.lang-btn')[idx].classList.add('active');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('language') || 'it';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
